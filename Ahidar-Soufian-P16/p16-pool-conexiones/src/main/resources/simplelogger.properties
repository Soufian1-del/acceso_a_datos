# Configuración de slf4j-simple, que muestra los mensajes de HikariCP
# Los mensajes salen en la consola normal, en el orden en que ocurren
org.slf4j.simpleLogger.logFile=System.out
# Solo se muestran los mensajes de nivel INFO o más importantes
org.slf4j.simpleLogger.defaultLogLevel=info
# Formato corto: sin el nombre del hilo y con el nombre corto de la clase
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
